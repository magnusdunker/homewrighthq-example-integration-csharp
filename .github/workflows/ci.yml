name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      # trimming-advarsler afsløres kun ved publish
      - run: dotnet publish src/ExampleCounter.csproj -c Release -r linux-x64 -o out
